plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.6'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'


    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    testImplementation 'org.springframework.security:spring-security-test'
    // implementation 'org.springframework.boot:spring-boot-starter-websocket' // (중복이라 하나 지워도 됨)

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += '--enable-preview'
}

tasks.named('bootRun') {
    jvmArgs += '--enable-preview'
}

// Git ignore rules do not affect resource packaging. Keep private local files
// in place, but never copy them into runtime/test classpaths or either JAR.
tasks.named('processResources') {
    exclude 'secret/**'
    exclude '**/*.key', '**/*.pem', '**/*.p12', '**/*.pfx', '**/*.jks', '**/*.keystore'
    exclude '**/*_backup.sql', '**/backup.sql', '**/*.sql.gz', '**/*.sql.zip'
    exclude '**/*.bak', '**/*.dump'
}

// Defense in depth for archives assembled from an existing resources output.
tasks.withType(Jar).configureEach {
    exclude 'secret/**', 'BOOT-INF/classes/secret/**'
    exclude '**/*.key', '**/*.pem', '**/*.p12', '**/*.pfx', '**/*.jks', '**/*.keystore'
    exclude '**/*_backup.sql', '**/backup.sql', '**/*.sql.gz', '**/*.sql.zip'
    exclude '**/*.bak', '**/*.dump'
}

compileJava {
    options.compilerArgs += ['--enable-preview']
}
// Explicit opt-in: loopback-only MariaDB fixture database; never uses application datasource settings.
tasks.register('mariaDbIntegrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    jvmArgs += '--enable-preview'
    filter { includeTestsMatching 'com.backend.admin.live.MariaDbHttpIntegrationTest' }
    systemProperty 'petmily.mariadb.url', System.getProperty('petmily.mariadb.url', '')
    systemProperty 'petmily.browser', System.getProperty('petmily.browser', 'false')
    systemProperty 'petmily.integration.output', System.getProperty('petmily.integration.output', '/tmp/petmily-maria-live/results')
}
